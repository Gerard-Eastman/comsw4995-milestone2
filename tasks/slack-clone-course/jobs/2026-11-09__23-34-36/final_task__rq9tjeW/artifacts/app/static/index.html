<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div id="auth-modal"><form data-testid="auth-form" data-mode="login" role="form"><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign in</button><button id="auth-toggle" data-testid="auth-toggle" type="button">Sign up</button><input name="display_name" style="display:none"></form></div>
<aside><div data-testid="workspace-header">Huddle</div><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button></aside>
<main><h2 data-testid="channel-title"># general</h2><div data-testid="channel-topic"></div><div data-testid="message-list"></div><input id="message-input" data-testid="message-input"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></main>
<div id="create-channel-modal"><form data-testid="create-channel-form"><div role="alert"></div><input name="name"><input type="checkbox" id="create-channel-private" data-testid="create-channel-private"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal"><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" style="display:none"><div data-testid="settings-pane-members" style="min-width:220px;min-height:40px"></div><div data-testid="settings-pane-invitations" style="display:none;min-width:220px;min-height:40px"><div data-testid="invitations-list">No invitations</div></div><div data-testid="settings-pane-general" style="display:none;min-width:220px;min-height:40px"><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option value="open">open</option><option value="invite_only">invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button></div><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button></div>
<section data-testid="thread-panel"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></section>
<button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button>
<section id="workspace-create"><form data-testid="workspace-create-form"><input name="slug"><input name="name"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option></select><button type="submit" data-testid="workspace-general-submit" data-button-role="primary">Create workspace</button></form><button data-testid="empty-state-create-workspace">Create</button></section>
<form data-testid="join-workspace-form"><input><button data-testid="join-workspace-submit" data-button-role="primary">Join</button><span data-testid="join-workspace-error"></span></form>
<div data-testid="current-user"></div>

<div data-testid="channel-settings-title"></div><div data-testid="channel-members-list"></div>
<button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary"></button>
<form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form>
<input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Topic</button>
<button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button>
<button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button>
<form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form>
<div data-testid="settings-tab-members"></div><div data-testid="settings-tab-invitations"></div><div data-testid="settings-tab-general"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><div data-testid="invitations-list"></div>
<script src="/static/app.js"></script></body></html>
