<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div id="auth-modal"><form data-testid="auth-form" data-mode="login"><h1>Huddle</h1><input name="username" placeholder="Username" required><input name="password" type="password" required><input name="display_name" placeholder="Display name" hidden><button type="submit" id="auth-submit" data-testid="auth-submit" data-button-role="primary">Log in</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Sign up</button><div role="alert"></div></form></div>
<div id="app"><aside><div data-testid="workspace-header">Huddle</div><div data-testid="current-user"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="logout-btn" data-button-role="danger">Logout</button></aside><main><header><b data-testid="channel-title">#general</b><span data-testid="channel-topic"></span><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></header><section data-testid="message-list"></section><form id="message-form"><input data-testid="message-input" name="body"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main><section id="thread-panel" data-testid="thread-panel" hidden><button data-testid="close-thread" data-button-role="secondary">Close</button><div></div><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Reply</button></section></div>
<div id="create-channel-modal" hidden><form data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><div role="alert"></div></form></div>
<div id="channel-settings-modal" hidden><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><h2 data-testid="channel-settings-title">Channel settings</h2><button data-testid="channel-settings-close" data-button-role="secondary">Close</button><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><div data-testid="channel-members-list"></div></div>
<div id="workspace-settings-modal" hidden><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><button data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div data-testid="invitations-list"></div></div>
<form data-testid="workspace-create-form"><input name="slug" placeholder="workspace slug"><input name="name" placeholder="workspace name"><button type="submit" data-testid="workspace-general-submit" data-button-role="primary">Create workspace</button><div role="alert"></div></form><button data-testid="empty-state-create-workspace" hidden>Create workspace</button><div data-testid="join-workspace-form"></div><button data-testid="join-workspace-submit" data-button-role="primary" hidden>Join</button><script src="/static/app.js"></script></body></html>
