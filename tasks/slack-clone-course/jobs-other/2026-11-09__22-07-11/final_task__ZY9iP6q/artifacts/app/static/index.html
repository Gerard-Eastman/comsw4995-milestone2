<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/static/style.css"></head><body>
<div id="auth-modal"><form data-testid="auth-form" data-mode="login"><input name="username"><input name="password" type="password"><input name="display_name" hidden><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Login</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Sign up</button><span role="alert"></span></form></div>
<aside><div data-testid="workspace-header"></div><div data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button></aside>
<main><h2 data-testid="channel-title"></h2><div data-testid="channel-topic"></div><div data-testid="message-list"></div><input id="message-input" data-testid="message-input"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></main>
<section id="thread-panel" data-testid="thread-panel"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></section>
<div id="create-channel-modal"><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal"><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><h3 data-testid="channel-settings-title"></h3><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal"><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><div data-testid="settings-tab-members"></div><div data-testid="settings-tab-invitations"></div><div data-testid="settings-tab-general"></div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div></div>
<form data-testid="workspace-create-form"><input name="slug"><input name="name"><button data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button></form><form data-testid="join-workspace-form"><input><button data-testid="join-workspace-submit" data-button-role="primary">Join</button><span data-testid="join-workspace-error"></span></form>
<form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><button data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div data-testid="invitations-list"></div>
<script src="/static/app.js"></script></body></html>
